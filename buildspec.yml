version: 0.2

env:
  parameter-store:
    DOCKER_REGISTRY_USERNAME: /myapp/docker-credentials/username
    DOCKER_REGISTRY_PASSWORD: /myapp/docker-credentials/password

phases:
  install:
    runtime-versions:
      nodejs: 12
    commands:
      - echo "Installing Node.js and npm..."
      - node --version
      - npm --version
      - npm config set registry https://registry.npmjs.org/

pre_build:
  commands:
    - echo "Checking Docker credentials..."
    - 'if [ -z "$DOCKER_REGISTRY_USERNAME" ]; then echo "USERNAME EMPTY"; else echo "USERNAME EXISTS"; fi'
    - 'if [ -z "$DOCKER_REGISTRY_PASSWORD" ]; then echo "PASSWORD EMPTY"; else echo "PASSWORD EXISTS"; fi'
    - echo "Docker version:"
    - docker --version
    - echo "Trying Docker login..."
    - 'printf "%s\n" "$DOCKER_REGISTRY_PASSWORD" | docker login -u "$DOCKER_REGISTRY_USERNAME" --password-stdin'
    - echo "Docker login completed successfully"

  build:
    commands:
      - echo "Build started on `date`"
      - echo "Building Docker image..."
      - 'IMAGE_REPO_NAME="tws-online-shop-app-demo"'
      - 'IMAGE_NAME="$DOCKER_REGISTRY_USERNAME/$IMAGE_REPO_NAME"'
      - 'docker build -t "$IMAGE_NAME:latest" .'

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image to Docker Hub...
      - docker push $IMAGE_NAME:latest
      - echo Uploading zip file to S3...
      - aws s3 cp online-shop-app.zip s3://tws-online-shop-demo-570017719653-us-east-2-an/online-shop-app/
      - echo Writing image definitions file...
      - printf '[{"name":"web","imageUri":"%s"}]' "$IMAGE_NAME:latest" > imageDefinitions.json
      - cat imageDefinitions.json

artifacts:
  files:
    - '**/*'
  discard-paths: no
